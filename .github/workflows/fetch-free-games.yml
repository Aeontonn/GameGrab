# Keeps the list of always-free games (free to play) fresh.
# Runs once a day, and can also be started manually from the Actions tab on GitHub.
#
# DATABASE_URL must exist as a repo secret, the same way as for
# fetch-offers.yml.

name: Fetch free to play games

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    name: Run fetch_free_games.py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Fetch and save games
        run: python -m app.fetch_free_games
