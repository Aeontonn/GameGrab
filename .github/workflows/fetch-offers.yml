# Keeps the offers in the database fresh.
# Runs automatically every 3 hours, and can also be started manually from
# the Actions tab on GitHub.
#
# DATABASE_URL must exist as a repo secret (Settings → Secrets and
# variables → Actions) and point to the same Supabase database the backend
# uses on Render.

name: Fetch offers

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    name: Run fetch_offers.py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Fetch and save offers
        run: python -m app.fetch_offers
