# Checks that the code works before it reaches main.
# Runs on every pull request against main, and on every push to main.
# The result shows up as a green check or a red cross directly in the pull request.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Vite requires Node 20.19 or 22.12 and later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what's in package-lock.json and
      # stops if the file is broken – the same error Vercel would otherwise find first.
      - run: npm ci

      - name: Lint
        run: npx oxlint

      # Also runs TypeScript's type check, since the build script starts with tsc.
      - name: Build
        run: npm run build

  backend:
    name: Backend starts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # main.py refuses to start without DATABASE_URL. The address here is made up:
    # SQLAlchemy only connects when a request comes in, so it's enough to
    # check that the code loads. The real address never leaves Render.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Catches syntax errors in all files.
      - name: Syntax
        run: python -m compileall -q app

      # Catches misspelled imports and errors in the FastAPI setup.
      - name: Loads
        run: python -c "import app.main, app.fetch_offers"
