# Kontrollerar att koden fungerar innan den når main.
# Körs på varje pull request mot main, och på varje push till main.
# Resultatet syns som en grön bock eller ett rött kryss direkt i pull requesten.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend bygger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Vite kräver Node 20.19 eller 22.12 och senare.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installerar exakt det som står i package-lock.json och
      # stoppar om filen är trasig – samma fel som Vercel annars hittar först.
      - run: npm ci

      - name: Lint
        run: npx oxlint

      # Kör även TypeScripts typkontroll, eftersom build-skriptet börjar med tsc.
      - name: Bygg
        run: npm run build

  backend:
    name: Backend startar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # main.py vägrar starta utan DATABASE_URL. Adressen här är påhittad:
    # SQLAlchemy ansluter först när ett anrop kommer, så det räcker för att
    # kontrollera att koden laddar. Den riktiga adressen lämnar aldrig Render.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Fångar syntaxfel i alla filer.
      - name: Syntax
        run: python -m compileall -q app

      # Fångar felstavade importer och fel i uppsättningen av FastAPI.
      - name: Laddar
        run: python -c "import app.main, app.fetch_offers"
